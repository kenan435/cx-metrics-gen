# Exists for port-forwarding to /status and /healthz. Metrics do not travel
# through it: they are pushed to Coralogix over OTLP.
apiVersion: v1
kind: Service
metadata:
  name: cx-metrics-gen
  namespace: cx-metrics-gen
  labels:
    app.kubernetes.io/name: cx-metrics-gen
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: cx-metrics-gen
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
