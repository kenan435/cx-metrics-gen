apiVersion: apps/v1
kind: Deployment
metadata:
  name: cx-metrics-gen
  namespace: cx-metrics-gen
  labels:
    app.kubernetes.io/name: cx-metrics-gen
spec:
  # Keep this at 1 unless you have thought about it. Every replica generates
  # the same customer catalog, so replicas are only safe because each one
  # stamps its own service.instance.id (see INSTANCE_ID below). More replicas
  # means proportionally more series, not more throughput per series.
  replicas: 1

  # Recreate, not RollingUpdate: during a rollout two pods would briefly emit
  # the same metrics with independent cumulative counters. Their instance ids
  # differ so nothing corrupts, but the duplicated load is just noise in a lab.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: cx-metrics-gen

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cx-metrics-gen
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: cx-metrics-gen
          image: ghcr.io/kenan435/cx-metrics-gen:main
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Distinguishes replicas and survives as service.instance.id on the
            # metrics. Without it, two pods would write the same series.
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Named explicitly rather than pulled in with envFrom, so an
            # overlay can repoint it at a Coralogix secret that already
            # exists in the cluster instead of duplicating the key.
            - name: CORALOGIX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cx-metrics-gen
                  key: CORALOGIX_API_KEY

          envFrom:
            - configMapRef:
                name: cx-metrics-gen

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Cumulative temporality keeps one aggregation per series alive
              # for the life of the pod. Raise this if you raise CUSTOMER_COUNT.
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
