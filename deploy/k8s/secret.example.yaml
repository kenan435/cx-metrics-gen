# Do NOT commit a real key. Copy this to secret.local.yaml (gitignored) and
# fill it in, or create the secret imperatively:
#
#   kubectl -n cx-metrics-gen create secret generic cx-metrics-gen \
#     --from-literal=CORALOGIX_API_KEY=cxtp_xxx
apiVersion: v1
kind: Secret
metadata:
  name: cx-metrics-gen
  namespace: cx-metrics-gen
type: Opaque
stringData:
  CORALOGIX_API_KEY: "REPLACE_ME"
